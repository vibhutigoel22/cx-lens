# Builds, tests and packages Coralogix Lens as a macOS DMG.
# Packaging logic lives in packaging/macos/build-app.sh; docs in packaging/macos/README.md.
name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node.js bundled inside the app. Pick a release at least two weeks old.
  NODE_RUNTIME_VERSION: "22.23.3"

jobs:
  build:
    name: Build, test and package
    runs-on: macos-latest   # Apple Silicon; the app bundles both arm64 and x64 Node runtimes
    timeout-minutes: 40
    permissions:
      contents: write        # needed only to publish releases on main / tags
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Work out version and build name
        id: meta
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SUFFIX=""
          else
            VERSION="$PKG_VERSION"
            SUFFIX="$SHORT_SHA"
          fi
          {
            echo "version=$VERSION"
            echo "suffix=$SUFFIX"
            echo "dmg=Coralogix-Lens-$VERSION${SUFFIX:+-$SUFFIX}.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Cache Node.js runtimes for the app bundle
        uses: actions/cache@v5
        with:
          path: .cache/node-runtime
          key: node-runtime-${{ env.NODE_RUNTIME_VERSION }}

      - name: Import Developer ID certificate (only when secrets are set)
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        if: env.P12_BASE64 != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package app and DMG
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_SUFFIX: ${{ steps.meta.outputs.suffix }}
          OUT_DIR: ${{ github.workspace }}/dist-mac
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$SIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export NOTARIZE=1
          fi
          bash packaging/macos/build-app.sh

      - name: Check the DMG mounts and contains the app
        shell: bash
        run: |
          DMG="dist-mac/${{ steps.meta.outputs.dmg }}"
          test -f "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          test -x "$MNT/Coralogix Lens.app/Contents/MacOS/CoralogixLens"
          test -L "$MNT/Applications"
          test -f "$MNT/Coralogix Lens.app/Contents/Resources/server/server.mjs"
          plutil -lint "$MNT/Coralogix Lens.app/Contents/Info.plist"
          echo "DMG contents OK"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.dmg }}
          path: |
            dist-mac/*.dmg
            dist-mac/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Refresh the "latest" pre-release (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: dist-mac/${{ steps.meta.outputs.dmg }}
        shell: bash
        run: |
          cp "$DMG" dist-mac/Coralogix-Lens-latest.dmg
          ( cd dist-mac && shasum -a 256 Coralogix-Lens-latest.dmg > Coralogix-Lens-latest.dmg.sha256 )
          NOTES="Automatic build of main at ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC'))."
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease --title "Coralogix Lens (latest main build)" --notes "$NOTES"
          else
            gh release create latest --prerelease --title "Coralogix Lens (latest main build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload latest dist-mac/Coralogix-Lens-latest.dmg dist-mac/Coralogix-Lens-latest.dmg.sha256 --clobber

      - name: Publish versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: dist-mac/${{ steps.meta.outputs.dmg }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "Coralogix Lens ${{ steps.meta.outputs.version }}" --generate-notes

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coralogix Lens macOS build"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            if ls dist-mac/*.dmg >/dev/null 2>&1; then
              echo "- DMG: \`${{ steps.meta.outputs.dmg }}\` ($(du -h "dist-mac/${{ steps.meta.outputs.dmg }}" | cut -f1))"
              echo "- SHA-256: \`$(cut -d' ' -f1 "dist-mac/${{ steps.meta.outputs.dmg }}.sha256")\`"
              echo "- Download it from **Artifacts** below."
            else
              echo "- No DMG was produced. Check the failed step's log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
